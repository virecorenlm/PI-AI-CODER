# Configuration for Pi Code Assistant
# Copy this to config.yaml and customize

# Model settings
model:
  path: "./models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
  context_size: 4096
  max_tokens: 2048
  temperature: 0.1
  top_p: 0.95
  top_k: 40
  repeat_penalty: 1.1
  threads: 4  # Pi 5 has 4 cores

# Context management
context:
  max_tokens: 3000
  max_file_size_kb: 500
  auto_discovery: true
  
  # Files to always ignore
  ignore_patterns:
    - "*.pyc"
    - "__pycache__"
    - ".git"
    - "node_modules"
    - ".venv"
    - "venv"
    - "*.so"
    - "*.o"
    - ".DS_Store"
    - "*.min.js"
    - "*.min.css"

# Conversation
conversation:
  max_history_turns: 5
  
  # System prompt (customize assistant behavior)
  system_prompt: |
    You are Claude Code, an expert coding assistant running locally.
    
    Your capabilities:
    - Reading and analyzing code files
    - Suggesting improvements and refactoring
    - Debugging and explaining errors
    - Writing new code and documentation
    - Following best practices
    
    You respond concisely but thoroughly. When showing code, use proper formatting.

# UI/UX
interface:
  verbose: false
  show_context_size: false
  show_timing: false
  
  # Prompt symbol
  prompt: ">>> "
  
  # Colors (ANSI codes)
  colors:
    info: "\033[0;32m"      # Green
    warning: "\033[1;33m"   # Yellow
    error: "\033[0;31m"     # Red
    reset: "\033[0m"

# Advanced
advanced:
  # Cache parsed files between runs
  cache_enabled: true
  cache_dir: ".file_cache"
  
  # Enable experimental features
  experimental:
    streaming: false
    embeddings: false
    
  # Performance monitoring
  profiling:
    enabled: false
    log_file: "performance.log"
