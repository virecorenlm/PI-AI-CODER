# Configuration for PI-AI-CODER
# Copy this to config.yaml and customize.
#
# PI-AI-CODER runs on any Linux host (Raspberry Pi, an Ubuntu workstation,
# etc.) with a choice of model backend ("provider"). Hardware tuning
# (threads, context size, which provider) belongs here, not in code.

# Model settings
model:
  # Which backend to use: "llama_cpp" or "ollama"
  provider: llama_cpp

  # -- llama.cpp settings (used when provider: llama_cpp) --
  path: "./models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
  llama_cpp_dir: "./llama.cpp"
  threads: 4  # tune per host -- e.g. 4 on a Pi 5, higher on a workstation

  # -- shared sampling settings (used by both providers) --
  context_size: 4096
  max_tokens: 2048
  temperature: 0.1
  top_p: 0.95
  top_k: 40
  repeat_penalty: 1.1

# Ollama settings (used when model.provider: ollama)
# Ollama is assumed to already be running (e.g. `ollama serve`, or as a
# systemd service) -- PI-AI-CODER only talks to it over HTTP and never
# starts an Ollama process itself.
ollama:
  host: "http://127.0.0.1:11434"
  model: "qwen3.5:latest"
  timeout: 120

# Optional named host profiles -- a bundle of the settings above, selected
# with `--profile <name>` or a top-level `profile: <name>` key here. Handy
# when the same project directory is used from more than one machine.
# Keys are flat (not nested under model:/ollama:); "model" means an Ollama
# tag when the profile's provider is ollama, otherwise a llama.cpp GGUF path.
profiles:
  pi5:
    provider: llama_cpp
    threads: 4
    context_size: 4096

  asrock:
    provider: ollama
    ollama_host: "http://127.0.0.1:11434"
    model: "qwen3.5:latest"

# Context management
context:
  max_tokens: 3000
  max_file_size_kb: 500
  auto_discovery: true
  
  # Files to always ignore
  ignore_patterns:
    - "*.pyc"
    - "__pycache__"
    - ".git"
    - "node_modules"
    - ".venv"
    - "venv"
    - "*.so"
    - "*.o"
    - ".DS_Store"
    - "*.min.js"
    - "*.min.css"

# Conversation
conversation:
  max_history_turns: 5
  
  # System prompt (customize assistant behavior)
  system_prompt: |
    You are Claude Code, an expert coding assistant running locally.
    
    Your capabilities:
    - Reading and analyzing code files
    - Suggesting improvements and refactoring
    - Debugging and explaining errors
    - Writing new code and documentation
    - Following best practices
    
    You respond concisely but thoroughly. When showing code, use proper formatting.

# UI/UX
interface:
  verbose: false
  show_context_size: false
  show_timing: false
  
  # Prompt symbol
  prompt: ">>> "
  
  # Colors (ANSI codes)
  colors:
    info: "\033[0;32m"      # Green
    warning: "\033[1;33m"   # Yellow
    error: "\033[0;31m"     # Red
    reset: "\033[0m"

# Advanced
advanced:
  # Cache parsed files between runs
  cache_enabled: true
  cache_dir: ".file_cache"
  
  # Enable experimental features
  experimental:
    streaming: false
    embeddings: false
    
  # Performance monitoring
  profiling:
    enabled: false
    log_file: "performance.log"
